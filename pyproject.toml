[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spliceai"
version = "1.3.4"
description = "SpliceAI: A deep learning-based tool to identify splice variants"
readme = "README.md"
license = { text = "GPLv3" }
authors = [{ name = "Kishore Jaganathan", email = "kishorejaganathan@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "keras>=3.0",
    "pyfastx>=2.1.0",
    "pysam>=0.10.0",
    "numpy>=1.14.0",
    "pandas>=0.24.2",
]

[project.optional-dependencies]
cpu = ["tensorflow>=2.0"]
gpu = ["tensorflow[and-cuda]>=2.14"]

[project.urls]
Homepage = "https://github.com/illumina/SpliceAI"

[project.scripts]
spliceai = "spliceai.__main__:main"

[tool.setuptools]
packages = ["spliceai"]

[tool.setuptools.package-data]
spliceai = ["annotations/*.txt", "models/*.h5"]
